services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: supergood
      POSTGRES_PASSWORD: supergood
      POSTGRES_DB: supergood
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    platform: linux/amd64
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

volumes:
  postgres-data:
